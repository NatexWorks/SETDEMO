name: Portfolio checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install isolated QA tooling
        run: npm run qa:install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run Vitest and React Testing Library suite
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm run test:unit 2>&1 | tee artifacts/vitest.log

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000

      - name: Start production server
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/natexworks-next.log 2>&1 &
          echo $! > /tmp/natexworks-next.pid
          node -e 'const until = Date.now() + 90000; const tick = async () => { try { const r = await fetch("http://127.0.0.1:3000"); if (r.ok) process.exit(0); } catch {} if (Date.now() > until) { console.error("Next.js server did not become ready"); process.exit(1); } setTimeout(tick, 1000); }; tick();'

      - name: Run responsive, route and accessibility checks
        run: npm run test:browser

      - name: Run real-click, forms, redirect and network checks
        run: npm run test:interactions

      - name: Run Lighthouse CI performance and SEO audits
        run: |
          export CHROME_PATH="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          npm run test:lighthouse

      - name: Upload QA reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natexworks-quality-reports
          path: artifacts/
          if-no-files-found: ignore
