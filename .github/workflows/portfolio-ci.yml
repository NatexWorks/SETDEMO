name: Portfolio CI

on:
  push:
    branches:
      - "rebuild/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reconcile the pre-existing incomplete lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Build production app
        run: npm run build
        env:
          SITE_URL: https://preview.invalid
          SITE_INDEXABLE: "false"

      - name: Smoke-test production routes
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/setdemo-next.log 2>&1 &
          node scripts/route-smoke.mjs
        env:
          SITE_URL: https://preview.invalid
          SITE_INDEXABLE: "false"
          BASE_URL: http://127.0.0.1:3000

      - name: Commit repaired lockfile to rebuild branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/rebuild/')
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: reconcile npm lockfile"
            git push
          fi
